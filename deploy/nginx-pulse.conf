# nginx reverse proxy for pulse.infinitee.biz → gunicorn (127.0.0.1:8000)
# Use this if TLS is terminated ON the box (nginx + Let's Encrypt/certbot).
# If TLS is terminated upstream (Cloudflare / load balancer), you only need the
# proxy_pass + X-Forwarded-* headers; the LB handles 443/certs.
#
# Install:
#   sudo cp deploy/nginx-pulse.conf /etc/nginx/sites-available/pulse
#   sudo ln -sf /etc/nginx/sites-available/pulse /etc/nginx/sites-enabled/pulse
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo certbot --nginx -d pulse.infinitee.biz     # auto-adds the 443 block + cert
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name pulse.infinitee.biz;

    # certbot fills in the 443 server block + redirect. Until then this proxies :80.
    client_max_body_size 25M;              # allow CSV/Excel uploads

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # Django reads this (SECURE_PROXY_SSL_HEADER)
        proxy_read_timeout 120s;
    }

    # WhiteNoise serves /static/ from the app, but nginx can short-circuit it:
    location /static/ {
        alias /home/ubuntu/Daily-Sales-Dashboard/staticfiles/;
        access_log off;
        expires 30d;
    }

    # Hide nginx version
    server_tokens off;
}
